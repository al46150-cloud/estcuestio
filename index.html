<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Formulario CSS3</title>
    <style>
     body {
    background-color: #222222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: center;
}

form {
    background-color: black;
    width: 590px;
    padding: 60px;
    border: 2px solid white;
    box-sizing: border-box;
}

.two-columns {
    display: flex;
    gap: 15px;
}

.fields {
    margin: 15px 0;
    display: flex;
    flex-direction: column;
    flex: 1;
}

label {
    color: white;
    font-size: 14px;
    text-transform: uppercase;
    margin-bottom: 8px;
}

input {
    background-color: transparent;
    border: none;
    border-bottom: 2px solid white;
    color: white;
    padding: 8px 0;
    width: 100%;
    box-sizing: border-box;
}

textarea {
    background-color: transparent;
    border: 2px solid white;
    color: white;
    padding: 8px;
    width: 100%;
    height: 120px;
    box-sizing: border-box;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: yellow;
    outline: none;
}

button {
    display: block;
    margin: 20px auto 0;
    background-color: #1beae990;
    color: white;
    font-size: 12px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    padding: 8px 16px;
}

button:hover {
    background-color: #1aea90;
}


.btn{
    text-align: center;
}

</style>

</head>
<body>
     <form>
		<div class="two-columns">
			<div class="fields">
				<label for="name">Nombre</label>
				<input id="name" type="text" name="name" autocomplete="off"> 	
			</div>
			
			<div class="fields">
				<label for="lastname">Apellido</label>
				<input id="lastname" type="text" name="lastname" autocomplete="off">	
			</div>
		</div>

		<div class="two-columns">
			<div class="fields">
				<label for="tel">Telefono</label>
				<input id="tel" type="text" name="tel" autocomplete="off">
			</div>

			<div class="fields">
				<label for="email">Correo</label>
				<input id="email" type="email" name="email" autocomplete="off">	
			</div>
		</div>
		

		<div class="fields">
			<label for="coment">Comentarios</label>
             <textarea id="comentarios" name="comentarios" rows="5"   cols="40"
            placeholder="ninguno"></textarea>
		</div>

		<div class="btn">
			<button>Enviar</button>	
		</div>
	</form>
</body>
</html>
